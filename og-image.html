<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  html, body { margin: 0; padding: 0; }
  .og {
    width: 1200px; height: 630px;
    background: #F5F1E8;
    position: relative;
    overflow: hidden;
    font-family: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif;
    padding: 72px 80px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .og::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(30,25,20,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,25,20,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 16px; position: relative; }
  .brand img { width: 56px; height: 56px; }
  .brand-text { font-family: 'Satoshi', ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; color: #1A1915; }
  h1 {
    font-size: 92px;
    line-height: 0.97;
    letter-spacing: -0.035em;
    color: #1A1915;
    margin: 0;
    font-weight: 700;
    max-width: 940px;
    position: relative;
  }
  h1 em { font-style: italic; color: #9C7A3C; font-weight: 500; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
    padding-top: 28px;
    border-top: 1px solid rgba(30,25,20,0.18);
  }
  .tagline {
    font-family: 'Satoshi', ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    color: #3E3B35;
    max-width: 480px;
    line-height: 1.45;
  }
  .url {
    font-family: ui-monospace, 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #1A1915;
    font-weight: 600;
  }
  .ecg {
    position: absolute;
    right: 80px;
    top: 72px;
    width: 180px;
    height: 40px;
  }
</style>
</head>
<body>
<div class="og">
  <div>
    <div class="brand">
      <img src="assets/logo-full-blue-transparent.png" alt="" />
      <span class="brand-text">DPC Bookkeeper</span>
    </div>
    <svg class="ecg" viewBox="0 0 300 40" preserveAspectRatio="none">
      <path d="M0 20 L80 20 L95 8 L110 32 L125 4 L140 36 L155 20 L300 20" fill="none" stroke="#9C7A3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>The only<br/>bookkeeper built<br/>for <em>Direct Primary Care.</em></h1>
  <div class="footer-row">
    <div class="tagline">One flat fee. One focus. One advisor who never needs you to explain what DPC is.</div>
    <div class="url">dpcbookkeeper.com</div>
  </div>
</div>
</body>
</html>
